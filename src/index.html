<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="dark">

<head>
  <base href="/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Building Fit Audit</title>
  <meta name="description" content="Audit des salles de sport Building Fit : formulaire bilingue FR/AR, note automatique et suivi des audits.">
  <!-- Outil interne : ne pas indexer -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-title" content="Building Fit">
  <meta name="application-name" content="Building Fit Audit">

  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- ============================================
         PRELOAD CRITICAL ASSETS
         ============================================ -->
  <link rel="preload" href="assets/imgs/building-fit-logo.jpg" as="image" type="image/jpeg">

  <!-- Critical CSS Inline (optional, generated at build time) -->
  <style>
    /* Critical above-the-fold CSS */
    :root {
      --bf-red: rgb(196, 22, 28);
      --bf-bg: rgb(10, 10, 10);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bf-bg);
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Loading spinner */
    .app-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--bf-bg);
      z-index: 9999;
    }

    .app-loading__spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(196, 22, 28, 0.1);
      border-top-color: var(--bf-red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <!-- ============================================
         APP ROOT WITH LOADING FALLBACK
         ============================================ -->
  <app-root>
    <!-- Loading indicator shown before Angular boots -->
    <div class="app-loading" role="status" aria-live="polite">
      <div class="app-loading__spinner" aria-label="Chargement de l'application"></div>
    </div>
  </app-root>

  <!-- ============================================
         NOSCRIPT FALLBACK
         ============================================ -->
  <noscript>
    <div style="padding: 2rem; text-align: center; background: #0a0a0a; color: #fff;">
      <h1 style="color: #c4161c;">JavaScript Requis</h1>
      <p>Cette application nécessite JavaScript pour fonctionner.</p>
      <p>Veuillez activer JavaScript dans votre navigateur.</p>
      <hr style="border-color: #333; margin: 2rem 0;">
      <p lang="ar" dir="rtl">يتطلب هذا التطبيق تفعيل JavaScript للعمل بشكل صحيح.</p>
    </div>
  </noscript>
</body>

</html>
