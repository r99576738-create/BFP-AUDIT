<div class="bf-wizard__design-switcher">
  <button
    type="button"
    class="bf-design-btn"
    [class.bf-design-btn--active]="currentDesign === 'circular'"
    (click)="setDesign('circular')"
    [attr.aria-label]="'Design circulaire'"
    title="Timeline Circulaire">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="12" r="3" fill="currentColor"/>
    </svg>
  </button>

  <button
    type="button"
    class="bf-design-btn"
    [class.bf-design-btn--active]="currentDesign === 'wave'"
    (click)="setDesign('wave')"
    [attr.aria-label]="'Design vague'"
    title="Wave Timeline">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M2 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0 4 4 6 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <button
    type="button"
    class="bf-design-btn"
    [class.bf-design-btn--active]="currentDesign === 'metro'"
    (click)="setDesign('metro')"
    [attr.aria-label]="'Design métro'"
    title="Metro Map">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <rect x="3" y="6" width="18" height="12" rx="2" stroke="currentColor" stroke-width="2"/>
      <path d="M3 10h18M8 6v4M16 6v4" stroke="currentColor" stroke-width="2"/>
    </svg>
  </button>

  <span class="bf-design-indicator" [attr.data-design]="currentDesign"></span>
</div>
