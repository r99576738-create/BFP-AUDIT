<app-circular-header *ngIf="design === 'circular'" 
    [data]="data" 
    [isStepCompleted]="isStepCompleted"
    [canGoTo]="canGoTo" 
    [trackBySection]="trackBySection" 
    (stepClick)="onStepClick($event)">
</app-circular-header>
