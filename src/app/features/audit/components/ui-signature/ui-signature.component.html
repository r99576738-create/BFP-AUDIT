<!-- ========================================
     SIGNATURE COMPONENT — Canvas-based Pad
     ======================================== -->
<div 
    class="bf-signature" 
    [class.bf-signature--empty]="isEmpty"
    [class.bf-signature--disabled]="disabled"
    role="group"
    [attr.aria-label]="title">

    <!-- ============ HEADER / TOOLBAR ============ -->
    <div class="bf-signature__header">
        
        <!-- Title -->
        <div class="bf-signature__title">
            <span class="bf-signature__dot" aria-hidden="true"></span>
            <span>{{ title }}</span>
            <span 
                *ngIf="required" 
                class="bf-signature__required"
                aria-label="required">
                *
            </span>
        </div>

        <!-- Tools -->
        <div class="bf-signature__tools">
            <button 
                type="button"
                class="bf-btn bf-btn--ghost bf-signature__btn"
                (click)="undo()" 
                [disabled]="!canUndo || disabled"
                [attr.aria-label]="'Annuler le dernier trait'">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M3 7v6h6M21 17v-6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <path d="M20.49 9A9 9 0 0 0 5.64 5.64L3 13m18-4l-2.64 7.36A9 9 0 0 1 3.51 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Undo</span>
            </button>

            <button 
                type="button"
                class="bf-btn bf-btn--ghost bf-signature__btn"
                (click)="clear()" 
                [disabled]="isEmpty || disabled"
                [attr.aria-label]="'Effacer la signature'">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Clear</span>
            </button>
        </div>
    </div>

    <!-- ============ CANVAS FRAME ============ -->
    <div 
        class="bf-signature__frame"
        [class.bf-signature__frame--active]="drawing">
        
        <canvas 
            #canvas
            class="bf-signature__canvas"
            (pointerdown)="onDown($event)"
            (pointermove)="onMove($event)"
            (pointerup)="onUp()"
            (pointercancel)="onUp()"
            [attr.aria-label]="'Zone de signature'"
            role="img">
        </canvas>

        <!-- Hint Overlay (when empty) -->
        <div 
            class="bf-signature__hint" 
            *ngIf="isEmpty"
            aria-hidden="true">
            
            <div class="bf-signature__hint-card">
                <div class="bf-signature__hint-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M12 19l7-7 3 3-7 7-3-3z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 2l7.586 7.586" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="11" cy="11" r="2" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
                
                <p class="bf-signature__hint-text">
                    {{ hint }}
                </p>
            </div>
        </div>
    </div>

    <!-- ============ FOOTER ============ -->
    <div class="bf-signature__footer">
        <p class="bf-signature__note">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                <path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>{{ note }}</span>
        </p>
    </div>
</div>
